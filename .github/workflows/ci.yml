name: CI

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_native_assets:
        description: "Also build rootfs.tar.gz and libproot artifacts"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── agent-core: build + test ────────────────────────────────────────────────
  agent-core:
    name: agent-core Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build agent-core
        run: ./gradlew :agent-core:build --no-daemon

      - name: Run agent-core tests
        run: ./gradlew :agent-core:test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-core-test-results
          path: agent-core/build/reports/tests/test/

      - name: Build fat JAR (shadowJar)
        run: ./gradlew :agent-core:shadowJar --no-daemon

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: agentshell-jar
          path: agent-core/build/libs/*-all.jar
          retention-days: 7

  # ── rootfs: build Alpine rootfs ─────────────────────────────────────────────
  rootfs:
    name: Build Alpine rootfs
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_native_assets) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(toJson(github.event.commits), 'scripts/build_rootfs.sh'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rootfs.tar.gz
        run: bash scripts/build_rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-tarball
          path: android-app/src/main/assets/rootfs.tar.gz
          retention-days: 30

  # ── android-app: regular debug build (placeholder native assets) ───────────
  android-app:
    name: Android App Build & Test
    runs-on: ubuntu-latest
    needs: [ agent-core ]
    if: github.event_name != 'workflow_dispatch' || !inputs.build_native_assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_DIR"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create placeholder rootfs (CI — no Docker available)
        run: |
          mkdir -p android-app/src/main/assets
          tmp_rootfs_dir="$(mktemp -d)"
          mkdir -p "$tmp_rootfs_dir/etc"
          printf 'placeholder rootfs for CI APK build\n' > "$tmp_rootfs_dir/etc/agentshell-ci-placeholder"
          tar -czf android-app/src/main/assets/rootfs.tar.gz -C "$tmp_rootfs_dir" .
          rm -rf "$tmp_rootfs_dir"

      - name: Create placeholder jniLibs (CI — libproot not built here)
        run: |
          mkdir -p android-app/src/main/jniLibs/arm64-v8a
          mkdir -p android-app/src/main/jniLibs/armeabi-v7a
          mkdir -p android-app/src/main/jniLibs/x86_64
          # Placeholder .so files so the build doesn't fail due to missing files
          echo "placeholder" > android-app/src/main/jniLibs/arm64-v8a/libproot.so
          echo "placeholder" > android-app/src/main/jniLibs/armeabi-v7a/libproot.so
          echo "placeholder" > android-app/src/main/jniLibs/x86_64/libproot.so

      - name: Run Android unit tests
        run: ./gradlew :android-app:testDebugUnitTest --no-daemon

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android-app/build/reports/tests/

      - name: Assemble debug APK
        run: ./gradlew :android-app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agentshell-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── android-app: full debug build (real native sandbox assets) ─────────────
  android-app-full:
    name: Android App Full Build
    runs-on: ubuntu-latest
    needs: [ agent-core, rootfs, libproot ]
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_DIR"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs-tarball
          path: android-app/src/main/assets

      - name: Download libproot artifacts
        uses: actions/download-artifact@v4
        with:
          name: libproot-jniLibs
          path: android-app/src/main/jniLibs

      - name: List bundled native assets
        run: |
          ls -lh android-app/src/main/assets
          find android-app/src/main/jniLibs -maxdepth 2 -type f -name 'libproot.so' -exec ls -lh {} \;

      - name: Run Android unit tests
        run: ./gradlew :android-app:testDebugUnitTest --no-daemon

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-full
          path: android-app/build/reports/tests/

      - name: Assemble full debug APK
        run: ./gradlew :android-app:assembleDebug --no-daemon

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agentshell-full-debug-apk
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── libproot: build for real (runs only on main, requires Docker) ─────────
  libproot:
    name: Build libproot.so (all ABIs)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_native_assets) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(toJson(github.event.commits), 'scripts/build_proot.sh'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build libproot.so for arm64-v8a, armeabi-v7a, x86_64
        run: bash scripts/build_proot.sh

      - name: Upload libproot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libproot-jniLibs
          path: android-app/src/main/jniLibs/
          retention-days: 30
