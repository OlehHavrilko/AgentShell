name: Build Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at Android SDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_DIR"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          AGENTSHELL_UPLOAD_STORE_BASE64: ${{ secrets.AGENTSHELL_UPLOAD_STORE_BASE64 }}
        run: |
          test -n "$AGENTSHELL_UPLOAD_STORE_BASE64"
          printf '%s' "$AGENTSHELL_UPLOAD_STORE_BASE64" | base64 -d > android-app/release-keystore.jks

      - name: Build signed release APK and AAB
        env:
          AGENTSHELL_UPLOAD_STORE_FILE: android-app/release-keystore.jks
          AGENTSHELL_UPLOAD_STORE_PASSWORD: ${{ secrets.AGENTSHELL_UPLOAD_STORE_PASSWORD }}
          AGENTSHELL_UPLOAD_KEY_ALIAS: ${{ secrets.AGENTSHELL_UPLOAD_KEY_ALIAS }}
          AGENTSHELL_UPLOAD_KEY_PASSWORD: ${{ secrets.AGENTSHELL_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :android-app:assembleRelease :android-app:bundleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentShell-release-apk
          path: android-app/build/outputs/apk/release/*.apk

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentShell-release-aab
          path: android-app/build/outputs/bundle/release/*.aab
