name: code-review
description: "Reviews staged git changes and produces a structured code review"
riskThreshold: 70
maxIterations: 15

goal: |
  Review all staged git changes in the current repository.
  Steps:
  1. Run `git diff --staged` to see what changed
  2. Run `git diff --staged --stat` for a summary
  3. For each changed file, check for: bugs, security issues, missing error handling,
     code style violations, TODOs, hardcoded secrets
  4. Summarise findings as: CRITICAL / WARNING / INFO items
  5. End with an overall verdict: APPROVE / REQUEST_CHANGES / NEEDS_DISCUSSION

systemPrompt: |
  You are an expert code reviewer. Be concise, specific, and actionable.
  Focus on real problems, not style nitpicks.
  Format your review as:
  
  ## Summary
  <1-2 sentences>
  
  ## Issues
  - [CRITICAL] file.kt:42 — <description>
  - [WARNING]  file.kt:17 — <description>
  - [INFO]     file.kt:8  — <suggestion>
  
  ## Verdict
  APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION
