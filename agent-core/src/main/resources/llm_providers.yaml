providers:
  - id: openai
    enabled: true
    apiKey: "${OPENAI_API_KEY}"
    model: "gpt-4o-mini"
    maxTokens: 4096
    temperature: 0.7

  - id: ollama
    enabled: true
    host: "http://127.0.0.1:11434"
    model: "llama3.2"

  - id: anthropic
    enabled: false
    apiKey: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20240620"
    maxTokens: 4096
    temperature: 0.7

  - id: azure_openai
    enabled: false
    endpoint: "https://myresource.openai.azure.com"
    apiKey: "${AZURE_OPENAI_KEY}"
    deployment: "gpt-4o"
    maxTokens: 4096
    temperature: 0.7

  - id: vertex_ai
    enabled: false
    projectId: "my-gcp-project"
    location: "us-central1"
    model: "gemini-1.5-flash"
    maxTokens: 8192
    temperature: 0.7

  - id: cohere
    enabled: false
    apiKey: "${COHERE_API_KEY}"
    model: "command-r-plus"
    maxTokens: 4096
    temperature: 0.7

  - id: mistral
    enabled: false
    apiKey: "${MISTRAL_API_KEY}"
    model: "mistral-large-latest"
    maxTokens: 8192
    temperature: 0.7

  - id: groq
    enabled: false
    apiKey: "${GROQ_API_KEY}"
    model: "mixtral-8x7b-32768"
    maxTokens: 32768
    temperature: 0.7

  - id: deepseek
    enabled: false
    apiKey: "${DEEPSEEK_API_KEY}"
    model: "deepseek-coder-v2"
    maxTokens: 4096
    temperature: 0.7

  - id: huggingface
    enabled: false
    apiKey: "${HF_API_KEY}"
    model: "meta-llama/Meta-Llama-3.2-3B-Instruct"
    maxTokens: 4096
    temperature: 0.7

  - id: llama_cpp
    enabled: false
    modelPath: "/data/models/llama-3.2-1b-q4_0.gguf"
    binaryPath: "/data/bin/llama-cli"
    threads: 4

  - id: openrouter
    enabled: false
    apiKey: "${OPENROUTER_API_KEY}"
    model: "anthropic/claude-3.5-sonnet"
    maxTokens: 8192
    temperature: 0.7

  - id: gemini
    enabled: false
    apiKey: "${GEMINI_API_KEY}"
    model: "gemini-1.5-flash"
    maxTokens: 8192
    temperature: 0.7
